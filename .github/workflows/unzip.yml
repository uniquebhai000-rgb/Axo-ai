name: Unzip project
on:
  push:
    paths: ['axo-ai.zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q axo-ai.zip
          cp -a axo-ai/. .
          rm -rf axo-ai axo-ai.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Add AXO AI project"
          git push
